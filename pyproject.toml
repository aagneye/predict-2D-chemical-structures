[project]
name = "casmi"
version = "0.1.0"
description = "Enveda CASMI 2026 — predict 2D chemical structures from LC-MS/MS spectra"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Core dependencies needed for the baseline pipeline (no neural model).
# RDKit is pinned to the competition's scoring environment version so that
# our local tautomer-canonical InChIKey14 matching is byte-identical to how
# Kaggle will score us. See docs/06-implementation-plan.md.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "rdkit==2026.3.3",
    "numba>=0.59",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Neural channel (FPNet) — kept optional so the baseline pipeline can be
# installed without pulling ~2GB of CUDA wheels. Install on the Azure box.
train = [
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casmi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    # numba emits deprecation noise on some numpy combos; not actionable here
    "ignore::DeprecationWarning:numba.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E741",  # ambiguous variable names (l, I) — common in numeric/array code
]
